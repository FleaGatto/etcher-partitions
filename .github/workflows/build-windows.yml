name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    name: balenaEtcher for Windows x64
    runs-on: windows-2022
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # Needed by OpenSSL's assembly if pkg ends up building Node.js from source
      - name: Install NASM
        shell: pwsh
        run: |
          choco install nasm --no-progress -y
          echo 'C:\Program Files\NASM' >> $env:GITHUB_PATH

      - name: Cache pkg base binaries
        uses: actions/cache@v4
        with:
          path: ~/.pkg-cache
          key: pkg-cache-windows-x64-${{ hashFiles('forge.pkg-node.ts') }}
          restore-keys: pkg-cache-windows-x64-

      - name: Install dependencies
        shell: bash
        run: |
          # run install scripts one at a time: parallel node-gyp builds racing to
          # download the same Node.js headers fail on Windows
          export npm_config_foreground_scripts=true
          npm ci
          # the shrinkwrap is generated on linux/mac, so this package is missing
          npm i -D winusb-driver-generator

      - name: Build installer
        shell: bash
        env:
          # The Node.js version forge.pkg-node.ts pins has no prebuilt pkg base
          # binary, and building it from source takes hours on a runner; 24.20.0
          # is the newest one pkg-fetch ships (and knows the hash of).
          ETCHER_PKG_NODE_TARGET: node24.20.0
        run: npm run make -- --platform win32 --arch x64

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: balenaEtcher-partitions-win32-x64
          path: |
            out/make/**/*.exe
            out/make/**/*.zip
            out/make/**/*.nupkg
          if-no-files-found: error

      # Publish the installer on the releases tab, so it can be downloaded
      # directly instead of as an artifact zip (which needs a GitHub login)
      - name: Publish installer to releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          tag="v${version}-partitions"
          setup="$(find out/make -name '*Setup.exe' -print -quit)"
          test -n "$setup"
          asset="balenaEtcher-${version}-partitions-win-x64-Setup.exe"
          cp "$setup" "$asset"

          notes="balenaEtcher ${version} with partition targets: every partition
          is listed next to the whole drives, and the image is written from the
          start of the selected partition, leaving the parent drive's partition
          table and its other partitions untouched.

          Windows x64 installer, unsigned: SmartScreen will warn on first run.
          Built from ${GITHUB_SHA} by ${GITHUB_WORKFLOW} run ${GITHUB_RUN_ID}."

          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" \
              --title "balenaEtcher ${version} (partition targets)" \
              --notes "$notes"
          fi
          gh release view "$tag" --json url --jq .url
